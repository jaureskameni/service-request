---
openapi: "3.0.3"
info:
  title: "SERVICE PROVIDER MANAGEMENT REST API"
  description: "API for managing service provider"
  version: "0.0.1-SNAPSHOT"
paths:
  /service-request:
    post:
      tags:
      - "ServiceRequest"
      summary: "Create New Service Request"
      description: "Create New Service Request"
      operationId: "createNewServiceRequest"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestRegister"
      responses:
        "201":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponse"
        "403":
          description: "SERVICE_REQUEST_403_003"
        "404":
          description: "SERVICE_REQUEST_404_002"
  /service-request/{serviceRequestId}:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get Service Request By Id"
      description: "Get Service Request By Id"
      operationId: "getServiceRequestById"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "404":
          description: "SERVICE_REQUEST_404_003"
  /service-request/{serviceRequestId}/accept:
    put:
      tags:
      - "ServiceRequest"
      summary: "Accept Service Request"
      description: "Accept Service Request"
      operationId: "acceptServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_001, SERVICE_REQUEST_403_003"
        "404":
          description: "SERVICE_REQUEST_404_003"
        "409":
          description: "SERVICE_REQUEST_409_001"
  /service-request/{serviceRequestId}/follow-up:
    get:
      tags:
      - "ServiceRequestFollowUp"
      summary: "Get the follow-up for a service request"
      operationId: "getServiceRequestFollowUp"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Current bilateral follow-up state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestFollowUp"
        "403":
          description: "SERVICE_REQUEST_403_004, SERVICE_REQUEST_403_005"
        "404":
          description: "SERVICE_REQUEST_404_003, SERVICE_REQUEST_404_004"
        "409":
          description: "SERVICE_REQUEST_409_001"
  /service-request/{serviceRequestId}/follow-up/agreement:
    put:
      tags:
      - "ServiceRequestFollowUp"
      summary: "Submit the caller's agreement response"
      operationId: "answerServiceRequestAgreement"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpAnswerRequest"
      responses:
        "204":
          description: "Response recorded"
        "403":
          description: "SERVICE_REQUEST_403_004, SERVICE_REQUEST_403_005"
        "404":
          description: "SERVICE_REQUEST_404_003, SERVICE_REQUEST_404_004"
        "409":
          description: "SERVICE_REQUEST_409_001, SERVICE_REQUEST_409_002"
  /service-request/{serviceRequestId}/follow-up/service-completion:
    put:
      tags:
      - "ServiceRequestFollowUp"
      summary: "Declare whether the agreed service was completed"
      description: "Declare whether the agreed service was completed"
      operationId: "answerServiceRequestCompletion"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpAnswerRequest"
      responses:
        "204":
          description: "The caller's completion declaration was recorded."
        "403":
          description: "SERVICE_REQUEST_403_004, SERVICE_REQUEST_403_005"
        "404":
          description: "SERVICE_REQUEST_404_003"
        "409":
          description: "SERVICE_REQUEST_409_001, SERVICE_REQUEST_409_002, SERVICE_REQUEST_409_003"
  /service-request/{serviceRequestId}/review:
    post:
      tags:
      - "Review"
      summary: "Publish a review for a service request"
      operationId: "publishServiceRequestReview"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "204":
          description: "Review published"
        "400":
          description: "SERVICE_REQUEST_400_002"
        "403":
          description: "SERVICE_REQUEST_403_002"
        "404":
          description: "SERVICE_REQUEST_404_003, SERVICE_REQUEST_404_004"
        "409":
          description: "SERVICE_REQUEST_409_004, SERVICE_REQUEST_409_005"
  /service-provider/{providerId}/reviews:
    get:
      tags:
      - "Review"
      summary: "List public reviews for a provider"
      operationId: "getProviderReviews"
      parameters:
      - name: "providerId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "limit"
        in: "query"
        required: false
        description: "Number of reviews per page, between 10 and 100."
        schema:
          type: "integer"
          minimum: 10
          maximum: 100
          default: 10
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: 0
          default: 0
      responses:
        "200":
          description: "Published reviews with their confirmation level"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReviews"
        "404":
          description: "SERVICE_REQUEST_404_002"
        "400":
          description: "SERVICE_REQUEST_400_001"
  /service-provider/{providerId}/reviews/summary:
    get:
      tags:
      - "Review"
      summary: "Get public review statistics for a provider"
      operationId: "getProviderReviewSummary"
      parameters:
      - name: "providerId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Average rating, review count and rating distribution"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        "404":
          description: "SERVICE_REQUEST_404_002"
  /me/reviews/summary:
    get:
      tags:
      - "Review"
      summary: "Get the authenticated provider's public review statistics"
      operationId: "getMyReviewSummary"
      security:
      - bearerAuth: []
      responses:
        "200":
          description: "Average rating, review count and rating distribution"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        "404":
          description: "SERVICE_REQUEST_404_002"
  /reviews/{reviewId}/moderation:
    put:
      tags:
      - "ReviewModeration"
      summary: "Hide a review with a moderation reason"
      operationId: "hideReview"
      security:
      - bearerAuth: []
      parameters:
      - name: "reviewId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewModerationRequest"
      responses:
        "204":
          description: "Review hidden"
        "400":
          description: "SERVICE_REQUEST_400_003"
        "404":
          description: "SERVICE_REQUEST_404_005"
  /service-request/{serviceRequestId}/reject:
    put:
      tags:
      - "ServiceRequest"
      summary: "Reject Service Request"
      description: "Reject Service Request"
      operationId: "rejectServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestReject"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_001, SERVICE_REQUEST_403_003"
        "404":
          description: "SERVICE_REQUEST_404_003"
        "409":
          description: "SERVICE_REQUEST_409_001"
  /service-request/{serviceRequestId}/cancel:
    put:
      tags:
      - "ServiceRequest"
      summary: "Cancel Service Request"
      description: "Cancel Service Request"
      operationId: "cancelServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_002"
        "404":
          description: "SERVICE_REQUEST_404_003"
        "409":
          description: "SERVICE_REQUEST_409_001"
  /my/service-request:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get All My Service Requests"
      description: "Get All My Service Requests"
      operationId: "getAllMyServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceRequestStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: 0
          default: 0
      - name: "limit"
        in: "query"
        required: true
        description: "Number of service requests per page, between 10 and 100."
        schema:
          type: "integer"
          minimum: 10
          maximum: 100
          default: 10
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestPaginate"
        "400":
          description: "SERVICE_REQUEST_400_001"
  /my/provider/service-requests:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get all service requests received by the current provider"
      description: "Retrieve all service requests assigned to the authenticated service\
        \ provider."
      operationId: "getAllServiceRequestsForCurrentProvider"
      security:
      - bearerAuth: []
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceRequestStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
          default: 0
      - name: "limit"
        in: "query"
        required: true
        description: "Number of service requests per page, between 10 and 100."
        schema:
          type: "integer"
          minimum: "10"
          maximum: "100"
          default: 10
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestPaginate"
        "403":
          description: "SERVICE_REQUEST_403_003"
        "400":
          description: "SERVICE_REQUEST_400_001"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    ServiceRequestReject:
      type: "object"
      additionalProperties: false
      required:
      - "reason"
      properties:
        reason:
          type: "string"
    ServiceRequestRegister:
      required:
      - "providerId"
      - "serviceTypeId"
      type: "object"
      properties:
        providerId:
          type: "string"
          format: "uuid"
        serviceTypeId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
        location:
          type: "string"
    ServiceRequestPaginate:
      type: "object"
      required:
      - "serviceRequest"
      - "count"
      properties:
        serviceRequest:
          type: "array"
          items:
            $ref: "#/components/schemas/ServiceRequest"
        count:
          type: "integer"
          format: "int64"
    ServiceRequest:
      required:
      - "id"
      - "userId"
      - "providerId"
      - "serviceTypeId"
      - "status"
      - "createdAt"
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        providerId:
          type: "string"
          format: "uuid"
        serviceTypeId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
        location:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
        status:
          $ref: "#/components/schemas/ServiceRequestStatus"
    ServiceRequestStatus:
      type: "string"
      enum:
      - "PENDING"
      - "ACCEPTED"
      - "REJECTED"
      - "CANCELLED"
    FollowUpAnswer:
      type: "string"
      enum:
      - "YES"
      - "NO"
    FollowUpStatus:
      type: "string"
      enum:
      - "WAITING_FOR_AGREEMENT"
      - "AGREEMENT_DISPUTED"
      - "NO_AGREEMENT"
      - "WAITING_FOR_COMPLETION"
      - "COMPLETION_REPORTED_BY_CLIENT"
      - "COMPLETION_CONFIRMED"
      - "COMPLETION_DISPUTED"
      - "NOT_COMPLETED"
    FollowUpAnswerRequest:
      type: "object"
      additionalProperties: false
      required:
      - "answer"
      properties:
        answer:
          $ref: "#/components/schemas/FollowUpAnswer"
    ServiceRequestFollowUp:
      type: "object"
      required:
      - "serviceRequestId"
      - "status"
      - "clientAgreement"
      - "clientAgreementAt"
      - "providerAgreement"
      - "providerAgreementAt"
      - "scheduledAt"
      - "agreementConfirmedAt"
      - "clientCompletion"
      - "clientCompletionAt"
      - "providerCompletion"
      - "providerCompletionAt"
      - "canSubmitReview"
      - "canAnswerAgreement"
      - "canAnswerCompletion"
      - "completionAvailableAt"
      properties:
        serviceRequestId:
          type: "string"
          format: "uuid"
        status:
          $ref: "#/components/schemas/FollowUpStatus"
        clientAgreement:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FollowUpAnswer"
        clientAgreementAt:
          type: "string"
          format: "date-time"
          nullable: true
        providerAgreement:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FollowUpAnswer"
        providerAgreementAt:
          type: "string"
          format: "date-time"
          nullable: true
        scheduledAt:
          type: "string"
          format: "date-time"
          nullable: true
        agreementConfirmedAt:
          type: "string"
          format: "date-time"
          nullable: true
        clientCompletion:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FollowUpAnswer"
        clientCompletionAt:
          type: "string"
          format: "date-time"
          nullable: true
        providerCompletion:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FollowUpAnswer"
        providerCompletionAt:
          type: "string"
          format: "date-time"
          nullable: true
        canSubmitReview:
          type: "boolean"
        canAnswerAgreement:
          type: "boolean"
        canAnswerCompletion:
          type: "boolean"
        completionAvailableAt:
          type: "string"
          format: "date-time"
          nullable: true
    ReviewRequest:
      type: "object"
      additionalProperties: false
      required:
      - "rating"
      properties:
        rating:
          type: "integer"
          minimum: 1
          maximum: 5
        comment:
          type: "string"
          maxLength: 2000
    ReviewConfirmation:
      type: "string"
      enum:
      - "CONFIRMED_BY_BOTH"
      - "REPORTED_BY_CLIENT"
      - "CONTESTED_BY_PROVIDER"
    Review:
      type: "object"
      required:
      - "id"
      - "serviceRequestId"
      - "clientId"
      - "rating"
      - "confirmation"
      - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        serviceRequestId:
          type: "string"
          format: "uuid"
        clientId:
          type: "string"
          format: "uuid"
        rating:
          type: "integer"
        comment:
          type: "string"
        confirmation:
          $ref: "#/components/schemas/ReviewConfirmation"
        createdAt:
          type: "string"
          format: "date-time"
    ProviderReviews:
      type: "object"
      required:
      - "count"
      - "reviews"
      properties:
        count:
          type: "integer"
          format: "int64"
        reviews:
          type: "array"
          items:
            $ref: "#/components/schemas/Review"
    ReviewSummary:
      type: "object"
      required:
      - "averageRating"
      - "reviewCount"
      - "oneStarCount"
      - "twoStarCount"
      - "threeStarCount"
      - "fourStarCount"
      - "fiveStarCount"
      properties:
        averageRating:
          type: "number"
          format: "double"
        reviewCount:
          type: "integer"
          format: "int64"
        oneStarCount:
          type: "integer"
          format: "int64"
        twoStarCount:
          type: "integer"
          format: "int64"
        threeStarCount:
          type: "integer"
          format: "int64"
        fourStarCount:
          type: "integer"
          format: "int64"
        fiveStarCount:
          type: "integer"
          format: "int64"
    ReviewModerationRequest:
      type: "object"
      additionalProperties: false
      required:
      - "reason"
      properties:
        reason:
          type: "string"
          minLength: 1
          maxLength: 2000
    CreationResponse:
      type: "object"
      required:
      - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
