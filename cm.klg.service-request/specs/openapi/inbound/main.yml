---
openapi: "3.0.3"
info:
  title: "SERVICE PROVIDER MANAGEMENT REST API"
  description: "API for managing service provider"
  version: "0.0.1-SNAPSHOT"
paths:
  /service-request:
    post:
      tags:
      - "ServiceRequest"
      summary: "Create New Service Request"
      description: "Create New Service Request"
      operationId: "createNewServiceRequest"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestRegister"
      responses:
        "201":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponse"
        "403":
          description: "SERVICE_REQUEST_403_003 — provider is not approved; insufficient\
            \ authorization also returns 403 without a service code."
        "404":
          description: "SERVICE_REQUEST_404_002 — service provider not found."
        "400":
          description: "Malformed or invalid request body or UUID; no service business\
            \ code is guaranteed."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /service-request/{serviceRequestId}:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get Service Request By Id"
      description: "Get Service Request By Id"
      operationId: "getServiceRequestById"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "404":
          description: "SERVICE_REQUEST_404_003 — service request not found."
        "400":
          description: "Invalid serviceRequestId UUID; no service business code is\
            \ guaranteed."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /service-request/{serviceRequestId}/accept:
    put:
      tags:
      - "ServiceRequest"
      summary: "Accept Service Request"
      description: "Accept Service Request"
      operationId: "acceptServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_001 — request belongs to another provider;\
            \ SERVICE_REQUEST_403_003 — provider is not approved; insufficient authorization\
            \ returns 403 without a service code."
        "404":
          description: "SERVICE_REQUEST_404_003 — service request not found"
        "409":
          description: "SERVICE_REQUEST_409_001"
        "400":
          description: "Invalid serviceRequestId UUID; no service business code is\
            \ guaranteed."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /service-request/{serviceRequestId}/reject:
    put:
      tags:
      - "ServiceRequest"
      summary: "Reject Service Request"
      description: "Reject Service Request"
      operationId: "rejectServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestReject"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_001 — request belongs to another provider;\
            \ SERVICE_REQUEST_403_003 — provider is not approved; insufficient authorization\
            \ returns 403 without a service code."
        "404":
          description: "SERVICE_REQUEST_404_003 — service request not found"
        "409":
          description: "SERVICE_REQUEST_409_001"
        "400":
          description: "Invalid serviceRequestId UUID or reject body; no service business\
            \ code is guaranteed."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /service-request/{serviceRequestId}/cancel:
    put:
      tags:
      - "ServiceRequest"
      summary: "Cancel Service Request"
      description: "Cancel Service Request"
      operationId: "cancelServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceRequestId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "403":
          description: "SERVICE_REQUEST_403_002 — request belongs to another user;\
            \ insufficient authorization returns 403 without a service code."
        "404":
          description: "SERVICE_REQUEST_404_003 — service request not found"
        "409":
          description: "SERVICE_REQUEST_409_001"
        "400":
          description: "Invalid serviceRequestId UUID; no service business code is\
            \ guaranteed."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /my/service-request:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get All My Service Requests"
      description: "Get All My Service Requests"
      operationId: "getAllMyServiceRequest"
      security:
      - bearerAuth: []
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceRequestStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
          default: 0
      - name: "limit"
        in: "query"
        required: true
        description: "Number of service requests per page, between 10 and 100."
        schema:
          type: "integer"
          minimum: "10"
          default: 10
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestPaginate"
        "400":
          description: "SERVICE_REQUEST_400_001 — limit must be between 10 and 100\
            \ and page must be non-negative; malformed parameters return 400 without\
            \ a service code."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
  /my/provider/service-requests:
    get:
      tags:
      - "ServiceRequest"
      summary: "Get all service requests received by the current provider"
      description: "Retrieve all service requests assigned to the authenticated service\
        \ provider."
      operationId: "getAllServiceRequestsForCurrentProvider"
      security:
      - bearerAuth: []
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceRequestStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
          default: 0
      - name: "limit"
        in: "query"
        required: true
        description: "Number of service requests per page, between 10 and 100."
        schema:
          type: "integer"
          minimum: "10"
          default: 10
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestPaginate"
        "403":
          description: "SERVICE_REQUEST_403_003 — service provider is not approved;\
            \ insufficient authorization returns 403 without a service code."
        "400":
          description: "SERVICE_REQUEST_400_001 — limit must be between 10 and 100\
            \ and page must be non-negative; malformed parameters return 400 without\
            \ a service code."
        "401":
          description: "Bearer token is missing or invalid."
        "500":
          description: "Unexpected internal error."
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  responses:
    Unauthorized:
      description: "Token is missing or invalid"
    Forbidden:
      description: "Action is forbidden or service provider is not approved"
    NotFound:
      description: "Resource not found"
    Conflict:
      description: "Business transition is not allowed"
  schemas:
    ServiceRequestReject:
      type: "object"
      additionalProperties: false
      required:
      - "reason"
      properties:
        reason:
          type: "string"
    ServiceRequestRegister:
      required:
      - "providerId"
      - "serviceTypeId"
      type: "object"
      properties:
        providerId:
          type: "string"
          format: "uuid"
        serviceTypeId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
        location:
          type: "string"
    ServiceRequestPaginate:
      type: "object"
      required:
      - "serviceRequest"
      - "count"
      properties:
        serviceRequest:
          type: "array"
          items:
            $ref: "#/components/schemas/ServiceRequest"
        count:
          type: "integer"
          format: "int64"
    ServiceRequest:
      required:
      - "id"
      - "userId"
      - "providerId"
      - "serviceTypeId"
      - "status"
      - "createdAt"
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        providerId:
          type: "string"
          format: "uuid"
        serviceTypeId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        description:
          type: "string"
        location:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
        status:
          $ref: "#/components/schemas/ServiceRequestStatus"
    ServiceRequestStatus:
      type: "string"
      enum:
      - "PENDING"
      - "ACCEPTED"
      - "REJECTED"
      - "CANCELLED"
    CreationResponse:
      type: "object"
      required:
      - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
